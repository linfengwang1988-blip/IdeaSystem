            width: 50px;
            height: 50px;

            border-radius: 50%;

            }

            100% {

            }

            <!--             问题1 -->
            <div name="Question1" style="margin-bottom: 40px;">
                <div class="input_div" style="margin: auto;text-align:left; padding-left: 4%;margin-bottom: 5px;">

                </div>

            </div>
            <!--问题2 -->
            <div name="Question2" style="margin-bottom: 40px;">

                </div>
                <div class="input_div" style="margin: auto;text-align: center;">

                </div>

            </div>

                            return false; //终止循环 
                        }

    <script>
        function toNumber(str) {
            // 检查是否是纯数字（可选负号、小数点）
            if (/^-?\d+(\.\d+)?$/.test(str)) {
                return parseFloat(str);
            }
            return 0; // 非纯数字返回0
        }

    </script>
